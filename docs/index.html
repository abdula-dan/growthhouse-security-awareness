<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Security Awareness Training</title>
<style>
:root{
  --bg:#eaf2f2; --surface:#ffffff; --surface2:#f3f8f8; --text:#10272f; --muted:#51666d;
  --line:#c9d9db; --teal:#0b7a84; --teal-ink:#ffffff; --teal-soft:#d5eef0;
  --signal:#c93f08; --signal-ink:#ffffff; --ok:#1e7d3f; --ok-soft:#dcf1e3;
  --bad:#b3261e; --bad-soft:#fbe3e1; --warn:#8a5a00; --warn-soft:#fbefd0;
  --head:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08161b; --surface:#102229; --surface2:#0c1c22; --text:#e4f0f1; --muted:#93acb1;
    --line:#244149; --teal:#3cc3cc; --teal-ink:#052a2e; --teal-soft:#123a40;
    --signal:#ff7a45; --signal-ink:#2b0d00; --ok:#5fd28a; --ok-soft:#12361f;
    --bad:#ff8a80; --bad-soft:#3a1816; --warn:#f2c35b; --warn-soft:#3a2d0b;
  }
}
:root[data-theme="dark"]{
  --bg:#08161b; --surface:#102229; --surface2:#0c1c22; --text:#e4f0f1; --muted:#93acb1;
  --line:#244149; --teal:#3cc3cc; --teal-ink:#052a2e; --teal-soft:#123a40;
  --signal:#ff7a45; --signal-ink:#2b0d00; --ok:#5fd28a; --ok-soft:#12361f;
  --bad:#ff8a80; --bad-soft:#3a1816; --warn:#f2c35b; --warn-soft:#3a2d0b;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 var(--body);-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--head);font-weight:700;line-height:1.15;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:20px 18px 56px}
.top{display:flex;gap:20px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:22px}
.brandbar{display:inline-flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 14px;margin-bottom:14px}
.brandlogo{display:block;height:40px;width:auto}
.top h1{font-size:clamp(1.9rem,4.5vw,2.9rem);max-width:16ch}
.top p{margin:8px 0 0;color:var(--muted);max-width:52ch}
.who{display:flex;gap:10px;flex-wrap:wrap}
.who label{display:flex;flex-direction:column;font-size:.82rem;color:var(--muted);gap:3px}
.who input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);min-width:170px}
.overall{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.overall .big{font-family:var(--head);font-size:2.2rem;font-weight:700;min-width:4.2ch}
.bar{flex:1;min-width:200px;height:12px;background:var(--surface2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .35s}
.overall small{color:var(--muted);display:block}
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.col{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.col h2{font-size:1.15rem}
.col .mini{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted)}
.col .mini .bar{height:6px;min-width:0}
.tile{width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface2);border-radius:10px;padding:10px 11px;display:flex;justify-content:space-between;gap:8px;align-items:center;min-height:52px}
.tile:hover{border-color:var(--teal)}
.tile .t{font-weight:600;font-size:.95rem;line-height:1.25}
.tile .s{font-size:.75rem;color:var(--muted);display:block;font-weight:400;margin-top:2px}
.tile .dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:700}
.tile.read{border-color:var(--teal)}
.tile.read .dot{border-color:var(--teal)}
.tile.tried{border-color:var(--warn);background:var(--warn-soft)}
.tile.tried .dot{border-color:var(--warn);color:var(--warn)}
.tile.done{border-color:var(--teal);background:var(--teal-soft)}
.tile.done .dot{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.foot{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:600}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.teal{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.btn.danger{color:var(--bad)}
.note{font-size:.85rem;color:var(--muted)}
.panel{max-width:760px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:clamp(18px,4vw,34px)}
.crumb{background:none;border:none;padding:0;color:var(--teal);font-weight:600;margin-bottom:14px}
.panel h1{font-size:clamp(1.6rem,4vw,2.3rem);margin-bottom:6px}
.panel .intro{font-size:1.08rem;color:var(--muted);margin:0 0 18px;max-width:62ch}
.panel ul{padding-left:1.2rem;margin:0 0 18px;max-width:66ch}
.panel li{margin-bottom:9px}
.tip{background:var(--teal-soft);border-left:5px solid var(--teal);border-radius:8px;padding:12px 14px;margin:0 0 22px}
.tip b{display:block;margin-bottom:2px}
.qhead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px;color:var(--muted);font-size:.9rem}
.qhead .bar{height:7px;flex:1;max-width:220px;min-width:80px}
.q{font-family:var(--head);font-size:1.35rem;font-weight:700;line-height:1.3;margin:0 0 16px}
.opts{display:grid;gap:10px;margin-bottom:16px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface2);border-radius:10px;padding:12px 14px}
.opt:hover:not([disabled]){border-color:var(--teal)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:10px;padding:12px 14px;margin-bottom:16px}
.fb.good{background:var(--ok-soft);border-left:5px solid var(--ok)}
.fb.miss{background:var(--bad-soft);border-left:5px solid var(--bad)}
.score{font-family:var(--head);font-size:3rem;font-weight:700}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem;margin:12px 0 18px}
.tbl th,.tbl td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
.tbl th{font-weight:600;color:var(--muted)}
.tblwrap{overflow-x:auto}
textarea.sum{width:100%;min-height:170px;font:.85rem/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px}
.pill{display:inline-block;border-radius:99px;padding:1px 10px;font-size:.8rem;font-weight:600}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.no{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.panel.lesson{max-width:820px}
.panel h2{font-size:1.25rem;margin:24px 0 8px}
.panel p.body{margin:0 0 12px;max-width:66ch}
.fig{margin:0 0 6px}
.fig svg{display:block;width:100%;height:auto;background:var(--surface2);border:1px solid var(--line);border-radius:12px}
.fig figcaption{font-size:.88rem;color:var(--muted);margin-top:6px}
.fig svg text{font-family:var(--body)}
.fig svg .mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.fig .b{font-weight:700}
.gcard,.gsoft{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.gteal{fill:var(--teal)} .gsig{fill:var(--signal)}
.gtsoft{fill:var(--teal-soft);stroke:var(--teal);stroke-width:1.5}
.gbad{fill:var(--bad-soft);stroke:var(--bad);stroke-width:1.5}
.gok{fill:var(--ok-soft);stroke:var(--ok);stroke-width:1.5}
.gwarn{fill:var(--warn-soft);stroke:var(--warn);stroke-width:1.5}
.gl,.glb,.glo{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.gl{stroke:var(--muted)} .glb{stroke:var(--bad)} .glo{stroke:var(--ok)}
.gfm{fill:var(--muted)} .gfb{fill:var(--bad)} .gfo{fill:var(--ok)} .gfw{fill:var(--warn)}
.fig .tx{fill:var(--text)} .fig .tm{fill:var(--muted)} .fig .tw{fill:var(--teal-ink)} .fig .ts{fill:var(--signal-ink)}
.fig .tb{fill:var(--bad)} .fig .tg{fill:var(--ok)} .fig .tn{fill:var(--warn)}
.example{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:4px 0 6px;max-width:66ch}
.example b{display:block;margin-bottom:4px}
.dd{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 22px}
.dd>div{border-radius:10px;padding:12px 14px}
.dd .do{background:var(--ok-soft);border-left:5px solid var(--ok)}
.dd .dont{background:var(--bad-soft);border-left:5px solid var(--bad)}
.dd ul{margin:6px 0 0;padding-left:1.1rem}
.dd li{margin-bottom:5px}
@media (max-width:1020px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.dd{grid-template-columns:1fr}.board{grid-template-columns:1fr}.who input{min-width:0;width:100%}.who label{flex:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ============ CONTENT ============
   Question format: [question, CORRECT answer, wrong, wrong, wrong, explanation]
   The correct answer is always listed first here; order is shuffled when shown. */
const BRAND = "Security Awareness Training";
const CUSTOMER = "GrowthHouse";
const LOGO = "assets/growthhouse-logo.png";
// ---- Publish-time campaign variables (set these before each rollout) ----
const WINDOW_START = "2026-10-14";
const WINDOW_CLOSE = "2026-11-30";
const REPORT_EMAIL = "abdul@dialanerd.co.za";
const TRACK_URL = "https://default51be5a00f80244fca11ade997346a8.d4.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/14/workflows/cb004be442bb4055b5b3b032c1bedfde/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=dPLifXDfp9RbZ8J8SkWynHJA4MgFzldEs5-UOvVMNZI"; // Power Automate HTTP trigger -> OneDrive/SecurityTraining-Tracking
try{ document.title = (CUSTOMER ? CUSTOMER + " — " : "") + BRAND; }catch(e){}
const PASS_MARK = 2; // correct answers needed out of 3 to pass a topic

const MODULES = [
{ id:"email", name:"Email", topics:[
 { id:"phishing", title:"Phishing",
   intro:"Phishing is a message that pretends to be someone you trust so you will click, log in, pay or reveal something.",
   points:["Common signs: urgency or threats, an unexpected request, a generic greeting, and a link that goes somewhere other than where it claims.","The display name can say anything. Check the actual sender address, and hover over links before you click.","Never use the link in the message to verify it. Open the service yourself, or call a number you already trust.","Report suspicious mail using your company process. Do not forward it to colleagues."],
   tip:"If a message makes you feel rushed or scared, that feeling is the attack. Stop and verify through a separate channel.",
   qs:[
    ["An email from your bank says your account is suspended unless you confirm your details within 24 hours. What should you do?","Open your bank's app or type its address yourself, or call the number on your card, and report the email","Click the link and log in quickly so the account is not suspended","Reply to the email asking if it is genuine","Forward it to colleagues to see what they think","Real banks do not demand credentials by link under time pressure. Going to the bank yourself bypasses the attacker completely."],
    ["Which is the strongest warning sign in an email?","The display name looks right but the sender address uses an unrelated domain","The email contains a company logo","It arrived early in the morning","It ends with a standard signature","Logos and signatures are trivial to copy. A mismatched sender domain is much harder to fake convincingly."],
    ["You clicked a link and typed your password into the page before realising it was fake. What is the right next step?","Change that password right away and tell IT or your provider immediately","Close the page and carry on, since nothing visibly happened","Wait a few days to see if anything strange occurs","Delete the email so nobody finds out","Speed matters. Reporting early lets someone block the attacker before they use your login."]
   ]},
 { id:"attachments", title:"Email Attachments",
   intro:"Attachments are one of the most common ways malware arrives. A known sender does not guarantee a safe file.",
   points:["Higher-risk files: Office documents asking to enable macros, ZIP and ISO archives, HTML files, and anything with a double extension such as invoice.pdf.exe.","If a document says you must enable content or macros to view it, close it. That prompt is the trick.","Accounts get hijacked. A message from a real supplier can still be malicious, especially if it is brief and unexpected.","Confirm unexpected attachments with the sender using a different channel, such as a phone call."],
   tip:"Ask two questions: did I expect this, and does it make sense for this person to send it? If either answer is no, verify first.",
   qs:[
    ["Which attachment is most suspicious?","invoice.pdf.exe","Quarterly-report.xlsx that a colleague told you to expect","A photo from a family member you were just chatting with","Meeting-minutes.docx from your manager after today's meeting","A file whose real ending is .exe is a program disguised as a PDF. The others fit a context you can explain."],
    ["A Word document opens with a banner telling you to enable macros to see the content. What do you do?","Close it and check with the sender through another channel","Click Enable Content, since you need to read it","Enable macros but turn off Wi-Fi first","Forward it to a colleague to open instead","Macros can run code on your device. Legitimate documents rarely need them just to be readable."],
    ["A supplier you know emails an unexpected ZIP file with the message 'see attached'. Why is this still risky?","Their mailbox may have been compromised, so a familiar sender does not prove the file is safe","ZIP files are always illegal to open","Suppliers never send attachments","It is only risky if the email is long","Attackers often take over real accounts and send malware to the victim's contacts."]
   ]},
 { id:"spam", title:"Spam",
   intro:"Spam is unwanted bulk email. Much of it is harmless clutter, but a lot is scams or a delivery route for malware.",
   points:["Do not reply to spam or click Unsubscribe on messages from senders you do not know. It confirms your address is active.","Unsubscribing is fine for newsletters you actually signed up to.","Use the Report spam or Junk button so filters learn.","Use a separate address for online sign-ups and keep your work address off public sites."],
   tip:"Treat spam as a signal. A spam message that slips through is a good example to report, not to read.",
   qs:[
    ["You receive a marketing email from a company you have never heard of, with an Unsubscribe link. Best action?","Mark it as junk or spam and delete it","Click Unsubscribe to be removed","Reply asking them to stop","Click the link to see what the offer is","Unsubscribe links in spam often just confirm that your address works, leading to more spam."],
    ["Why is replying to a spam message a bad idea?","It confirms your mailbox is active and monitored by a person","It uses up your mailbox storage","It automatically infects your device","It is illegal to reply","A reply tells the sender they have found a live address worth targeting again."],
    ["Which habit reduces how much spam you receive?","Using a separate address for online sign-ups","Posting your email address on your public profile","Using your work address for competitions","Loading all images in every email","The fewer places your real address appears, the fewer lists it ends up on."]
   ]}
]},
{ id:"internet", name:"Internet Safety", topics:[
 { id:"wifi", title:"Public Wi-Fi",
   intro:"Anyone can set up a Wi-Fi network with a friendly name. Public hotspots are convenient but you cannot know who runs them.",
   points:["Attackers can copy a real network name to trick you into joining a fake one, known as an evil twin.","Traffic on open networks can be watched or altered. HTTPS helps, but it does not cover everything.","Safer options: your phone's mobile hotspot, or a company-approved VPN.","Turn off automatic joining of networks and file sharing on your devices."],
   tip:"If you must use public Wi-Fi, keep to low-risk browsing and avoid banking or admin logins.",
   qs:[
    ["At an airport you see two networks, 'Airport_Free_WiFi' and 'Airport Free WiFi'. What is the safest approach?","Ask staff for the exact network name, or use your own mobile data","Join the one with the stronger signal","Join both to compare speeds","It does not matter, they are the same","Copycat network names are a classic trap. Confirm with a trusted source."],
    ["You need to access your online banking while in a coffee shop. What is best?","Use your phone's mobile data or hotspot","Use the cafe Wi-Fi since the site has a padlock","Use the cafe Wi-Fi but only briefly","Ask the person next to you which Wi-Fi to use","Your own mobile connection avoids trusting an unknown network."],
    ["Which setting reduces your risk on public networks?","Turn off auto-join for networks and turn off file sharing","Leave auto-join on so you connect faster","Keep file sharing on in case someone needs a file","Disable your screen lock","Auto-join can connect you to a fake network with a familiar name without you noticing."]
   ]},
 { id:"https", title:"HTTPS",
   intro:"The padlock in your browser means your connection to the site is encrypted. It does not mean the site is honest.",
   points:["Criminals can and do get certificates for fake sites, so a padlock on a phishing page is common.","Read the real domain carefully. In https://login.example.com.evil.xyz/ the real domain is evil.xyz.","Never click through a browser certificate warning on a site where you log in or pay.","Do not enter passwords or card details on pages that start with http:// and show Not secure."],
   tip:"Padlock answers 'is the line private?'. It does not answer 'who am I talking to?'.",
   qs:[
    ["A website shows a padlock. What does this tell you?","The connection is encrypted, but not that the site is trustworthy","The site is owned by a real, legitimate company","The site is free of malware","Any password entered will be safe","Encryption protects data in transit. A scam site can have it too."],
    ["Your browser shows a full-page security warning when opening your company's login portal. What do you do?","Stop, do not proceed, and report it to IT","Click Advanced and continue, since you know the site","Try a different browser until the warning goes away","Ignore it, these warnings are usually wrong","A certificate error on a login page can mean someone is intercepting your connection."],
    ["Which address is the genuine Microsoft sign-in page?","https://login.microsoftonline.com/","https://login.microsoftonline.com.account-check.xyz/","https://microsoftonline-login.com/","https://secure.login-microsoftonline.net/","The real domain is the part immediately before the first single slash. The other options belong to different domains."]
   ]},
 { id:"filtering", title:"Web Content Filtering",
   intro:"Web filtering blocks known dangerous or inappropriate sites before you reach them. It is one layer of protection, not a guarantee.",
   points:["Filters use lists and live intelligence to block malicious, phishing and unsuitable categories.","They reduce risk but cannot catch everything, so your judgement still matters.","If a legitimate site is blocked, ask IT to review it instead of working around the block.","Personal VPNs and proxies used to bypass filtering remove protection and visibility."],
   tip:"A block message is the system working. Report false blocks, never bypass them.",
   qs:[
    ["A website you need for work is blocked. What should you do?","Ask IT to review the block","Switch to your personal mobile hotspot to get around it","Install a free proxy extension","Ask a colleague to open it for you","Reviewing lets the site be approved properly if safe, and keeps the protection in place for everyone."],
    ["Which statement about web filtering is correct?","It is one layer of defence and does not replace careful behaviour","It guarantees you can never visit a harmful site","It makes training unnecessary","It only matters for adult content","No single control is perfect. Filtering lowers risk while your habits cover the gaps."],
    ["Why is using an unapproved VPN to bypass filtering risky?","It removes security controls and exposes your traffic to the VPN provider","VPNs are always slower","It uses more data","It is only risky on weekends","Bypassing the filter removes the protection and may send your browsing through an untrusted third party."]
   ]},
 { id:"search", title:"Search Engine Safety",
   intro:"Search results can be poisoned. Criminals buy ads and build fake sites that look like the real download, login or help page.",
   points:["Ads at the top of results are labelled Sponsored. They can be malicious even when they look official.","For software, go to the vendor's official site or your device's app store.","Be careful searching for support phone numbers. Fake numbers are common in results.","Bookmark the sites you log in to often so you are not searching for them each time."],
   tip:"For anything involving money, logins or downloads, go straight to a bookmarked or typed address.",
   qs:[
    ["You search for a free PDF tool. The top result is a Sponsored ad for 'free-pdf-download-now.com'. Best action?","Go directly to the official vendor website or an official app store","Click the ad since it is the first result","Download from whichever result offers the newest version","Click the ad but decline any pop-ups","Malicious ads often mimic real downloads. Going to the source avoids the imitation."],
    ["Why is it risky to search for your bank's helpline and call the first number shown?","Results can include fake pages and ads with scammer numbers","Search engines show the wrong time","Phone calls are always recorded","Banks do not have helplines","Use the number printed on your card or statement, not one found through a search."],
    ["Which habit is safest for frequently used logins?","Use bookmarks you created yourself","Search for the site each time and click the first result","Click links in your email","Use whichever site appears in an ad","A bookmark takes you to the same trusted address every time."]
   ]}
]},
{ id:"threats", name:"Personalized Threats", topics:[
 { id:"social", title:"Social Engineering",
   intro:"Social engineering manipulates people rather than computers. It works by pushing emotions such as urgency, fear, helpfulness and trust in authority.",
   points:["Channels: email, phone calls, text messages, social media and in-person visits.","Typical stories: the boss who needs gift vouchers urgently, IT support who needs your code, a supplier who has changed bank details.","Any request for money, credentials or one-time codes needs verifying through a number or channel you already know.","Polite challenging is normal and professional. Real people will understand."],
   tip:"Authority plus urgency plus secrecy is the standard recipe. If you see all three, stop.",
   qs:[
    ["A caller says they are from IT and asks for the verification code you just received by SMS. What do you do?","Refuse, hang up, and call IT back on a number you already have","Read the code since they know your name","Give only the first three digits","Ask them to email you the request","Verification codes are never shared with anyone. Knowing your name proves nothing."],
    ["An email apparently from your CEO urgently asks you to buy gift vouchers and keep it confidential. What stands out?","Authority, urgency and secrecy together","The email is short","It came during working hours","It asks for something simple","This combination is a textbook business-email-compromise pattern. Verify by phone."],
    ["Someone in a courier uniform follows you through a secure door without scanning in. What is the best response?","Politely ask who they are visiting and direct them to reception","Hold the door, they look official","Ignore them and walk on","Give them your access card to save time","Tailgating relies on politeness. Redirecting to reception is polite and safe."]
   ]},
 { id:"insider", title:"Insider Threats",
   intro:"An insider threat is a risk that comes from people with legitimate access: employees, contractors or compromised accounts. Most incidents are mistakes, not malice.",
   points:["Types: negligent (mistakes and shortcuts), malicious (deliberate harm or theft) and compromised (an attacker using a real person's account).","Common accidents: emailing the wrong recipient, sharing passwords, using personal storage for business data.","Least privilege limits damage: people only get access they need for their job.","Report concerning behaviour early through the agreed channel. Do not investigate or confront it yourself."],
   tip:"Good security culture makes reporting normal and blame-free, so small problems are caught before they grow.",
   qs:[
    ["Which kind of insider incident is generally most common?","Accidental or careless mistakes","Deliberate sabotage by a disgruntled employee","Foreign intelligence agents","Insiders using stolen laptops in public","Most insider incidents come from errors and shortcuts, which is why training and simple processes matter."],
    ["Which control best reduces the damage an insider can do?","Least privilege, giving people only the access they need","Giving everyone administrator access","Sharing one login across the team","Removing audit logs","The less access an account has, the less harm a mistake or misuse can cause."],
    ["You see a colleague who is about to leave copying a large client database to a personal USB drive. What do you do?","Report it through the agreed channel without confronting them","Ignore it, it is not your business","Confront them in front of others","Join in so you also have a copy","Reporting lets the right people assess it properly. Confrontation can make things worse."]
   ]}
]},
{ id:"malware", name:"Malware", topics:[
 { id:"types", title:"Types of Malware",
   intro:"Malware is any software built to harm, spy on or take control of a device. Knowing the main types helps you recognise the symptoms.",
   points:["Ransomware encrypts files and demands payment to restore them.","Trojans pretend to be legitimate software, such as cracked games or fake installers, while giving attackers access.","Spyware, infostealers and keyloggers quietly capture passwords, keystrokes and browser data.","Worms spread by themselves across networks. Botnets turn many infected devices into a remote-controlled army."],
   tip:"Symptoms vary, and some malware shows none. Prevention and early reporting beat clean-up.",
   qs:[
    ["Your files will not open and a message demands payment for a decryption key. This is most likely:","Ransomware","Adware","A harmless software bug","Spam","Encrypting files and demanding payment is the defining behaviour of ransomware."],
    ["A free cracked game installs fine but also gives an attacker remote access. What type of malware is this?","A trojan","A worm","A firewall","A cookie","A trojan hides inside something that looks useful or legitimate."],
    ["Software secretly records everything you type, including passwords. What is it called?","A keylogger, a type of spyware","A rootkit scanner","A backup tool","A search engine","Keyloggers capture keystrokes and send them to the attacker."]
   ]},
 { id:"targets", title:"Malware Targets",
   intro:"Attackers do not only go after large companies. Much malware is automated and finds whoever is easiest.",
   points:["Small and medium businesses are attractive because defences are often weaker and operations depend on data.","Prized targets: logins, financial details, client data, and anything that lets attackers disrupt you and demand money.","Targets are not only laptops: phones, servers, routers, printers, cameras and other connected devices are all used.","Regular updates, tested backups and good habits make the biggest difference."],
   tip:"You do not need to be interesting. You only need to be reachable and unprepared.",
   qs:[
    ["A colleague says, 'We are too small for criminals to bother with us.' What is the accurate response?","Automated attacks hit any business, and smaller ones are often easier targets","They are right, small businesses are rarely attacked","Only banks need to worry","Attackers prefer well-defended networks","Most attacks are opportunistic scans and mass campaigns, not hand-picked victims."],
    ["Which of these is commonly overlooked as a malware target?","Printers, routers and other connected devices","Only desktop computers","Paper files","Office furniture","Internet-connected devices often run old software and are rarely monitored."],
    ["Why is business data valuable to criminals?","It can be stolen, sold, or held to ransom","It is always worthless to outsiders","It cannot be copied","It expires daily","Stolen data and locked systems both turn into money for attackers."]
   ]},
 { id:"delivery", title:"How Malware Gets to You",
   intro:"Malware needs a way in. Most of the time that way in is a person, not a technical break-in.",
   points:["Phishing links and attachments, malicious ads, and fake software updates or pop-ups.","Cracked software and downloads from unofficial sites.","Unknown USB drives, plus old software with known flaws that has not been patched.","Defences: install updates, download only from official sources, avoid admin accounts for daily work, and keep protection running."],
   tip:"Updates are not an annoyance. They close the holes that malware uses.",
   qs:[
    ["A pop-up says 'Your browser is out of date, click to update now'. What should you do?","Close it and update through the browser's own settings or IT","Click the button, updates are important","Click Allow on the notification","Enter your password to confirm","Fake update prompts are a common delivery method. Real updates come from the software itself."],
    ["You find a USB drive in the car park. What should you do?","Hand it to IT and do not plug it in","Plug it in to find the owner","Plug it into an old computer","Take it home to check","Dropped USB drives are a known attack technique."],
    ["Why do software updates matter for security?","They fix known vulnerabilities that malware can exploit","They make the computer look newer","They remove the need for passwords","They only add new features","Many attacks use flaws that already have a fix available."]
   ]}
]},
{ id:"passwords", name:"Passwords", topics:[
 { id:"personal", title:"Personal Info in Passwords",
   intro:"Names, birthdays, pets and teams feel memorable, and that is exactly why they are easy to guess or find online.",
   points:["Attackers check social media for names, dates, pets, schools and favourite teams.","Predictable patterns such as Summer2026! or Name1985 are among the first guesses.","Use a long passphrase of unrelated words, or let a password manager generate random passwords.","Treat answers to security questions like passwords. Do not give real, findable answers."],
   tip:"If someone could learn it from your public profile, it does not belong in your password.",
   qs:[
    ["Which password is the weakest?","Bella1987!","plum-ladder-ocean-teapot","T7#kq9Lz$vR2mW","correct-spade-lantern-mild-ferry","A pet name and a year is easy for an attacker to guess or discover. The others are long or random."],
    ["Why is using personal details in a password risky?","They can often be found on social media or in public records","They are too long to remember","Websites do not allow them","They slow down your device","Attackers research their targets, and tools try personal details first."],
    ["The security question asks for your mother's maiden name. What is the safest approach?","Enter a random answer and store it in your password manager","Enter the real answer","Enter your pet's name","Skip all security questions","Real answers can be researched. A random answer cannot."]
   ]},
 { id:"hygiene", title:"Password Hygiene",
   intro:"Good password habits are simple: make them long, make them unique, and never share them.",
   points:["Use a different password for every account. Reuse lets one breach unlock many accounts, known as credential stuffing.","Length beats complexity. Aim for at least 14 characters or a passphrase.","Do not share passwords or write them on notes stuck to a screen.","Change a password when you suspect it has been exposed, and check for breaches using a service such as Have I Been Pwned."],
   tip:"If you remember all your passwords, they are probably too weak or reused.",
   qs:[
    ["What is the main risk of using one password across many accounts?","A breach of one site gives attackers access to the others","It makes the password too long","The password expires faster","Websites will block you","Attackers try leaked passwords on other services automatically."],
    ["When should you change a password straight away?","When you suspect or know it has been exposed","Every Monday","Only when you forget it","Never","Prompt changes after a suspected leak matter more than changing for the sake of a schedule."],
    ["Which is the better password guidance?","Long and unique, such as a passphrase of 14 or more characters","Short with many symbols","One strong password for everything","A word followed by a number","Length is the biggest driver of strength, and uniqueness limits the damage of breaches."]
   ]},
 { id:"manager", title:"Password Management",
   intro:"A password manager creates, stores and fills in strong unique passwords so you only need to remember one.",
   points:["It can generate random passwords and fill them in only on the matching website, which also helps expose fake login pages.","Protect it with a long master passphrase and multi-factor authentication.","Spreadsheets, notes apps and sticky notes are not safe places for passwords.","Use a shared vault for team credentials rather than sending passwords in chat or email."],
   tip:"If your manager does not offer to fill a login, pause. The site might not be the one you think.",
   qs:[
    ["Where is the best place to keep your passwords?","A reputable password manager","A spreadsheet called passwords on your desktop","A note on your phone","An email to yourself","A manager encrypts your passwords and fills them securely."],
    ["Your password manager does not autofill on a login page you expected it to. What might this mean?","The page may be a fake with a different address","The manager is broken and you should type the password manually","The password has expired","Your internet is slow","Managers match the exact address. No match is a useful warning."],
    ["What is most important to protect in a password manager?","The master password, ideally with multi-factor authentication","The browser icon","The list of website names","Your username only","Everything in the vault depends on the master login."]
   ]},
 { id:"mfa", title:"Two-factor Authentication",
   intro:"Two-factor (or multi-factor) authentication adds a second proof of identity, so a stolen password alone is not enough.",
   points:["Stronger to weaker: passkeys or hardware keys, authenticator apps, then SMS codes.","Never share a one-time code or approve a prompt you did not start. Repeated prompts are an attack called MFA fatigue.","Store backup codes somewhere safe and offline.","Turn it on for email first, because email can reset almost every other account."],
   tip:"An unexpected approval request means someone else has your password. Deny it and change the password.",
   qs:[
    ["Your phone keeps showing sign-in approval requests that you did not trigger. What do you do?","Deny them, change your password and report it","Approve one so they stop","Ignore the phone","Turn off two-factor to stop the prompts","Prompts you did not trigger mean someone has your password. Approving gives them in."],
    ["Which method is generally the strongest?","A passkey or hardware security key","SMS code","Security question","Email a password to yourself","Passkeys and hardware keys resist phishing in a way codes cannot."],
    ["Which account should you secure with two-factor first?","Your email","A shopping site you rarely use","A loyalty card","A newsletter subscription","Control of your email lets an attacker reset your other accounts."]
   ]}
]},
{ id:"phishtech", name:"Phishing Techniques", topics:[
 { id:"malware-attach", title:"Malware Attachment",
   intro:"A malware attachment is a phishing message that carries a malicious file. The mail gives you a reason to open it, and opening the file runs code that can infect your device.",
   points:["The file is disguised as something routine: an invoice, a statement, a voicemail, a shared document or a CV.","Office files may ask you to Enable Content or Enable Editing. That prompt exists to run a macro, not to show you the document.","Password-protected ZIPs are common, because the password in the email lets the file slip past scanners that cannot look inside.","A real, known sender is not proof. Hijacked mailboxes send malware to the sender's own contacts."],
   tip:"If a file needs you to enable, unblock or allow something just to read it, that request is the attack. Close it and verify.",
   qs:[
    ["An email you did not expect carries a file called Voicemail.html and asks you to open it to hear a message. What is the safest response?","Do not open it, and report the message through your reporting process","Open it, since voicemails are normal at work","Open it on your phone instead of your laptop","Forward it to a colleague to check for you","Unexpected HTML attachments are a common malware and credential-theft route. Opening it elsewhere or forwarding it just spreads the risk."],
    ["A document opens blurred with a banner saying 'Enable Content to view'. What is actually happening?","The banner is trying to get you to run a macro that can install malware","The document is genuinely protected and needs unlocking","Your Office licence has expired","The file is too large to display","Legitimate documents do not need macros just to be readable. The prompt is the trick."],
    ["Why is a password-protected ZIP attachment a particular concern?","The password lets the malicious file bypass scanners that cannot inspect encrypted archives","ZIP files cannot contain malware","Password-protected files are always safe","It means the sender is verified","Encryption hides the contents from security tools, so the payload reaches you unscanned."]
   ]},
 { id:"cred-harvest", title:"Credential Harvest",
   intro:"A credential harvest sends you to a convincing fake login page. Whatever you type, usually your email and password, goes straight to the attacker.",
   points:["The page is a pixel-perfect copy of a sign-in you know: Microsoft 365, your bank, a courier, a document portal.","The trigger is usually a link: a shared file, a locked account, a held parcel, a new voicemail or payslip.","Read the real domain, the part just before the first single slash. login.microsoftonline.com is genuine; login.microsoftonline.com.verify.xyz is not.","Your password manager helps: it will not autofill a password on a look-alike address, and that silence is a warning."],
   tip:"Never sign in from a link in a message. Open the service from a bookmark or by typing the address, and let MFA back you up.",
   qs:[
    ["A link in an email opens a perfect Microsoft 365 sign-in page asking for your work password. What should you do?","Close it, open the service from a bookmark, and report the email","Enter your password, since the page looks exactly right","Enter a wrong password first to test if it is real","Enter your password but change it next week","Fake sign-in pages are exact copies. Looking right proves nothing; reaching it from a message is the red flag."],
    ["Which address is the genuine Microsoft sign-in page?","https://login.microsoftonline.com/","https://login.microsoftonline.com.secure-verify.xyz/","https://microsoft-365-login.com/","https://login.microsoft.account-check.net/","The real owner is the domain just before the first single slash. The others belong to different domains."],
    ["You entered your password on a page that turned out to be fake. What is the right first step?","Change that password immediately and report it to IT so the account can be protected","Do nothing, as long as you close the tab quickly","Wait to see whether anything unusual happens","Just enable MFA and keep the same password","Speed limits the damage. Reporting early lets IT force a sign-out, reset the password and check for misuse."]
   ]},
 { id:"driveby", title:"Drive-by URL",
   intro:"A drive-by URL takes you to a web page that silently runs code in your browser to probe or infect your device. Often you do not have to click anything on the page itself.",
   points:["The landing page may look blank, show a fake error, or imitate a familiar site while it works in the background.","It targets out-of-date browsers, plugins and operating systems, which is why prompt updates matter so much.","A shortened or redirecting link can hide the real destination until you are already there.","Keeping browsers patched and web filtering on stops most of these before the page loads."],
   tip:"The protection you cannot see, patched software and web filtering, is what blocks a page that attacks on arrival. Keep both current.",
   qs:[
    ["How does a drive-by URL typically infect a device?","By running code in the browser when the page loads, often exploiting outdated software","Only if you download and run a file","Only if you type your password","By sending a text message to your phone","Drive-by pages exploit unpatched browsers and plugins automatically, without needing a download or a login."],
    ["Which habit best reduces the risk from drive-by pages?","Keep your browser and operating system updated and leave web filtering on","Use an older browser that loads pages faster","Disable automatic updates to avoid interruptions","Turn off the web filter when a page is blocked","Patches close the flaws these pages exploit, and filtering blocks known-bad sites before they load."],
    ["A link is a shortened URL you cannot read, sent unexpectedly. Why is this riskier?","The real destination is hidden until you arrive, so you cannot judge it first","Shortened links are always malware","It will use more mobile data","Short links cannot be filtered","Hiding the destination removes your chance to spot a bad domain before the page opens."]
   ]},
 { id:"link-in-attach", title:"Link in Attachment",
   intro:"A link in attachment hides a phishing link inside a file, such as a PDF, Word document or image. The email body looks clean, so filters and a quick glance may pass over it. The trap is one click deeper.",
   points:["Putting the link inside a file helps the message get past scanners that only check the email body for bad links.","The attached file usually shows a button or image, 'View document', 'Open in OneDrive', 'Review invoice', that leads to a fake login or malware.","The same rules apply inside a file as in an email: check where the link really goes before you click.","Be extra cautious with unexpected PDFs that ask you to click through to sign in or view a secured document."],
   tip:"A clean-looking email with one attachment can still be phishing. Judge the link inside the file, not just the message around it.",
   qs:[
    ["A PDF from an unexpected email shows a big 'View secure document' button that opens a Microsoft 365 login. What is this most likely?","A link-in-attachment phish, using the file to hide a fake sign-in page","A genuine secure document portal","A broken PDF that needs re-sending","A harmless marketing attachment","Burying the link in a PDF helps it dodge link scanning. The sign-in it opens is the credential trap."],
    ["Why do attackers place the link inside an attachment rather than in the email body?","It can slip past filters that scan the message body for malicious links","Links only work inside PDFs","It makes the email load faster","Attachments cannot be reported","Moving the link into a file reduces the chance that email security flags it."],
    ["You open an attached document and it asks you to click a link to sign in and view the content. Best action?","Do not click; open the real service from a bookmark and report the message","Click the link, since the document is already open","Sign in quickly before the link expires","Save the file and click the link tomorrow","The link inside the file deserves the same suspicion as a link in the email. Reach the service yourself instead."]
   ]},
 { id:"link-to-malware", title:"Link to Malware",
   intro:"A link to malware points to a file hosted on a trusted-looking service such as SharePoint, OneDrive, Dropbox or Google Drive. The message carries no attachment, so it slips past attachment scanning. The download is the payload.",
   points:["Hosting the file on a well-known service borrows that service's good reputation and avoids sending the file through email.","The link often leads to a familiar file-share page, then to a download that is actually malware.","A trusted hosting brand does not make the file safe. Judge whether you expected this file from this person.","Confirm unexpected shared files with the sender through a separate channel before downloading."],
   tip:"A SharePoint or Dropbox link is not a safety badge. The question is the same: did I expect this file, and does it make sense?",
   qs:[
    ["You get an unexpected link to a file on a well-known cloud storage service. Why is a trusted host not reassurance?","Anyone can host a malicious file there; the brand does not vouch for the file","Those services scan and guarantee every file","Links to cloud storage cannot carry malware","It is only risky if there is also an attachment","Attackers use reputable hosts precisely to look trustworthy and avoid email attachment scanning."],
    ["What is the safest way to handle an unexpected shared-file link, even from a known sender?","Confirm with the sender through a separate channel before opening or downloading","Download it immediately since the host is reputable","Open it only on your phone","Forward it to a colleague to open first","A quick check by phone or chat catches a hijacked account or spoofed sender before the file runs."],
    ["Why does hosting malware on a file-sharing site help the attacker get past email security?","No file is attached to the email, so attachment scanning has nothing to inspect","File-sharing sites are exempt from the law","Email filters ignore all links","The file becomes smaller","With the payload hosted elsewhere, the email itself looks clean to attachment scanners."]
   ]},
 { id:"oauth-consent", title:"OAuth Consent Grant",
   intro:"An OAuth consent grant tricks you into approving a third-party app's request to access your account. There is no password to steal: you hand over access by clicking Accept, and the attacker keeps it even after you change your password.",
   points:["The prompt is a real sign-in and consent screen, often from a genuine provider, so there is no fake page to spot.","Warning signs: an app you do not recognise, asking for broad permissions such as read your mail, send mail, or access your files, often 'on your behalf' and even 'while you are not using the app'.","Because it grants a token rather than capturing a password, changing your password does not revoke it. Access has to be removed from the account's connected apps.","Grant access only to apps you deliberately set up and trust, and read exactly what an app is asking to do before you click Accept."],
   tip:"Read the permissions, not just the logo. If you did not go looking for this app, do not consent, and report it.",
   qs:[
    ["A consent screen asks you to let an unfamiliar app read and send your email 'on your behalf'. What should you do?","Decline, and report it, since you did not set up this app","Accept, because the sign-in page is genuine","Accept, then change your password afterwards to be safe","Accept the read permission but not the send permission","Broad permissions for an app you did not request are a classic OAuth abuse. Changing your password does not undo a granted token."],
    ["Why is an OAuth consent attack dangerous even though no password is stolen?","It grants the attacker a lasting access token that survives a password change","It is harmless because passwords are untouched","It only works if MFA is off","It expires the moment you sign out","Consent issues a token tied to the app, not your password, so the access remains until it is explicitly revoked."],
    ["How is access from a malicious consent grant actually removed?","By revoking the app's access in the account's connected or enterprise applications, usually with IT","By changing your password","By clearing your browser cookies","By turning your computer off and on","The token lives with the app's granted permissions, so it must be revoked from the account's app access, not reset like a password."]
   ]}
]}
];

/* ============ LESSON EXTRAS: long-form content ============ */
const EXTRA = {
phishing:{
  cap:"Four things to check on any suspicious email.",
  how:["Phishing works because it looks routine. Attackers copy a real brand's logo and tone, then add a reason to act now: a locked account, an unpaid invoice, a parcel that cannot be delivered. The link leads to a fake page that captures whatever you type, or quietly installs malware.","There are variants worth knowing. Spear phishing is written for one person using details found online. Smishing arrives by SMS and vishing by phone call. A QR code in an email can hide a fake link just as well as text can."],
  example:"Thandi in accounts gets an email that looks like it is from her company's courier: 'Delivery failed, pay R35 to reschedule.' The sender address is almost right and the page asks for card details. She doesn't click. She opens the courier's own website, finds no failed delivery, and reports the email.",
  dos:["Check the sender address, not just the display name","Hover over links to see where they really go","Report the message, then delete it"],
  donts:["Click links or scan QR codes in unexpected messages","Reply to the email or forward it to colleagues","Type a password into a page you reached from an email"]},
attachments:{
  cap:"Three files that look ordinary. Two of them are not.",
  how:["Malicious files rarely look dangerous. Attackers hide programs inside invoices, voicemails, shared-document notices and password-protected ZIPs (the password is in the email, so scanners cannot look inside). Office files can contain macros, which are small programs that run once you click Enable.","Windows often hides file extensions, so invoice.pdf.exe can appear as invoice.pdf. Turning on 'show file extensions' makes the real file type visible."],
  example:"A supplier's mailbox is hijacked and the criminal replies inside a genuine email thread with 'updated statement attached'. The thread is real, so it feels safe. The file is a .docm that asks for macros. A one-minute phone call to the supplier shows they never sent it.",
  dos:["Turn on file extensions in Windows","Confirm unexpected files by phone or chat","Open documents in preview mode where you can"],
  donts:["Enable macros or content because a document asks you to","Open ZIP, ISO or HTML files you did not expect","Assume a known sender means a safe file"]},
spam:{
  cap:"Filters catch most of it. Your reports help catch the rest.",
  how:["Spam is sent in bulk because it costs almost nothing. Even if one person in ten thousand responds, the sender profits. Lists are built from data breaches, scraped websites, and guesses at common address formats.","Filters stop most spam, but some gets through, and the filter learns from what you report. Every message you flag helps protect you and your colleagues."],
  example:"Sipho enters a competition using his work email. Within weeks he is getting messages about prizes, crypto investments and 'unpaid invoices'. From then on he uses a separate personal address for sign-ups and reports each junk message instead of opening it.",
  dos:["Use Report spam or Junk","Keep a separate address for online sign-ups","Unsubscribe only from senders you recognise"],
  donts:["Reply, even to say stop","Click links or load images in unknown mail","Publish your work email address on public pages"]},
wifi:{
  cap:"The fake network looks almost identical. Everything you send passes through the attacker.",
  how:["A Wi-Fi network name is just text. Attackers set up a hotspot with a familiar name and wait for devices to join, often because a phone connected automatically. From there they can watch unprotected traffic, redirect you to fake sign-in pages or show fake prompts.","HTTPS protects the content of many connections, but the attacker can still see which sites you visit, and fake pages can use HTTPS too. The safest choice is not to trust the network at all and use your own mobile data."],
  example:"A guest at a conference joins 'Conference_Guest_2'. The real network was 'Conference_Guest'. A sign-in page appears asking for their work email and password. Entering them hands those details straight to the person who set up the fake network.",
  dos:["Use your phone's hotspot for anything sensitive","Confirm the exact network name with staff","Turn off auto-join and file sharing"],
  donts:["Log in to banking or admin systems on public Wi-Fi","Enter work passwords on a sign-in page the network shows you","Click through certificate warnings"]},
https:{
  cap:"Only one part of the address tells you who you are really talking to.",
  how:["HTTPS encrypts the connection between your browser and a website, so others on the network cannot read what you send. That matters, but it says nothing about who owns the site. Certificates are cheap and automatic, which is why many phishing sites show a padlock.","The part that identifies the site is the registered domain: the name just before the first single slash. Anything to the left of it is a subdomain, which the owner of the domain can set to whatever they like."],
  example:"An email links to https://login.microsoftonline.com.account-check.xyz/. It has a padlock and starts with the right words. But the owner of the address is account-check.xyz, and the Microsoft part is only a subdomain the attacker chose.",
  dos:["Read the domain just before the first single slash","Type or bookmark addresses for important sites","Stop at certificate warnings and report them"],
  donts:["Treat the padlock as proof the site is trustworthy","Click through browser security warnings","Enter card details on pages that start with http://"]},
filtering:{
  cap:"The filter checks each site before the page opens.",
  how:["Web filters sit between your device and the internet. They check each site against category lists and live threat intelligence. Known phishing pages, malware downloads and newly registered suspicious sites can be blocked before the page loads. Some filters work through DNS and others through software on the device, so they can protect you at home as well as in the office.","No filter is perfect. New malicious sites appear every hour, and legitimate sites are sometimes blocked by mistake. That is why the rule is simple: do not bypass it, and do ask for a review."],
  example:"A staff member taps a link in a text message. The filter shows a block page saying the site is a known phishing page. Nothing is entered and nothing is downloaded, and IT can see that someone in the business is being targeted.",
  dos:["Report false blocks so they can be reviewed","Treat a block page as a useful warning","Keep protection running on laptops used away from the office"],
  donts:["Use personal VPNs or proxies to get around a block","Ask a colleague to open a blocked site for you","Switch protection off to save time"]},
search:{
  cap:"The ad appears first. The official site is further down.",
  how:["Attackers pay for search ads that sit above the real results, or build sites that rank well for popular searches such as 'download [software]' or '[bank] contact number'. The page looks right, but the download carries malware, or the phone number belongs to a scammer.","Ads are labelled Sponsored, but the label is easy to miss. The safest habit is not to search for places where money, logins or installers are involved. Use a bookmark, a typed address or the official app store."],
  example:"Someone looking for a PDF editor clicks the first result. It is an ad for a site that copies the vendor's design. The installer works, but it also installs a program that records their passwords.",
  dos:["Bookmark the logins you use often","Download only from the vendor's own site or an app store","Take support numbers from statements, cards or the official site"],
  donts:["Trust a result because it is at the top","Download software from a site you reached through an ad","Phone a number found through search for a bank or supplier"]},
social:{
  cap:"The pressure is the technique. Verification breaks it.",
  how:["Social engineers research you first: your job title, your manager's name, a supplier you use. Then they build a believable story and apply pressure so that you act before you think. The more pressure, the more likely a sensible person is to skip checking.","Common targets are finance staff (payment changes), IT helpdesks (password resets) and reception (physical access). In business email compromise, a fake request to change bank details is behind some of the largest financial losses in cybercrime."],
  example:"Finance receives an email from a long-standing supplier: 'We have changed banks, please use these details from this month.' It is polite and the logo is right. Finance phones the supplier on the number in their own records. The supplier knows nothing about it.",
  dos:["Verify payment changes by phone using a number you already hold","Slow down whenever you feel pressured","Offer to call back"],
  donts:["Share codes, passwords or card details","Act on an urgent payment request without a check","Let strangers follow you into secure areas"]},
insider:{
  cap:"Three kinds of insider risk, and what helps against each.",
  how:["Many people picture a rogue employee, but accidents are far more common: files sent to the wrong person, a laptop left on a train, a shared password. A smaller group is deliberate, such as someone leaving with client data. A third group is an ordinary account taken over by a criminal, which looks like an insider but is not one.","Because insiders already have access, technical controls matter: limit access to what each role needs, remove it promptly when people leave, and keep logs so unusual activity can be spotted."],
  example:"A staff member emails the full customer list to the wrong 'Sam' because auto-complete picked the first match. There was no bad intent, but it is a reportable data incident. A quick report means the recipient can be contacted and the email recalled.",
  dos:["Double-check recipients before sending sensitive data","Report mistakes quickly, without waiting","Use approved storage and sharing tools"],
  donts:["Share your login with a colleague","Copy business data to personal devices or accounts","Investigate or confront suspicious behaviour yourself"]},
types:{
  cap:"Different names, different jobs, same goal: profit for the attacker.",
  how:["Malware is an umbrella term, and what matters is what it does. Ransomware locks your files and demands payment. Trojans hide inside something that looks useful. Spyware and keyloggers watch you quietly. Worms spread on their own, and botnets make infected devices obey a remote controller.","Real attacks often chain these together. A phishing email delivers a trojan, which downloads spyware, which steals passwords that are later used to deploy ransomware."],
  example:"A staff member downloads a cracked version of design software to save the licence fee. It works, but a hidden trojan gives an attacker access. A fortnight later the file server is encrypted and a ransom note appears.",
  dos:["Keep security software running and up to date","Install software only from approved sources","Report odd behaviour such as pop-ups or sudden slowdowns"],
  donts:["Use cracked or pirated software","Pay a ransom without expert advice","Keep working on a device you think is infected"]},
targets:{
  cap:"Attackers go for what is reachable. The forgotten devices are the easiest.",
  how:["Most attacks are automated. Programs scan the internet for exposed systems, weak passwords and unpatched software, then attack whatever they find. Size does not matter, but being reachable does.","Smaller organisations are targeted partly because they often lack a dedicated security team, and partly because they supply bigger companies. Printers, routers, cameras and other connected devices are frequently forgotten: they keep default passwords and never get updated."],
  example:"A small firm's old office router still has its factory admin password. An automated scan finds it, the attacker logs in, and uses it as a doorway to the company's file server.",
  dos:["Keep an up-to-date list of the devices you own","Change default passwords on every device","Patch routers, printers and servers, not just laptops"],
  donts:["Assume you are too small to be targeted","Leave unused devices connected","Ignore update prompts on devices that are not computers"]},
delivery:{
  cap:"Six common routes onto a device. Most of them need your help.",
  how:["Malware needs help to run, and the easiest help is you. Phishing links, fake update pop-ups, files from unofficial sites and unknown USB drives all rely on someone clicking, opening or plugging in.","The other route is through software with known flaws. When a vendor fixes a flaw, attackers study the fix and target everyone who has not installed it yet. That is why prompt updates are one of the most effective defences you have."],
  example:"A staff member finds a USB stick labelled 'Salary review 2026' in the car park. Curiosity wins and they plug it in. It silently installs a remote-access tool. Handing it to IT unopened would have prevented the whole thing.",
  dos:["Install updates promptly","Hand found USB drives to IT without plugging them in","Use a standard account for daily work, not an administrator account"],
  donts:["Click pop-ups that say your device needs an update","Download from unofficial sites","Plug in devices you do not recognise"]},
personal:{
  cap:"The more personal the password, the easier it is to guess.",
  how:["People build passwords from what they remember, and what they remember is personal. Attack tools know this. They try names, years, sports teams and common substitutions such as a for @ first. Attackers can also read your social media to find your pet's name, your birthday and your school.","The strongest options are long random passwords made by a manager, or passphrases of four or more unrelated words. Length does more for strength than extra symbols do."],
  example:"A manager posts photos of her dog Bella online. Her password is Bella1987!, based on her birth year. Someone who finds her profile tries the obvious combinations and gets in within a handful of guesses.",
  dos:["Use a passphrase of four or more unrelated words","Let a password manager generate random passwords","Give security questions random answers"],
  donts:["Use names, birthdays, pets or phone numbers","Add a number or symbol to a word and call it safe","Reuse your favourite pattern across sites"]},
hygiene:{
  cap:"With reuse, one breach opens everything. Unique passwords contain the damage.",
  how:["Data breaches happen constantly. When a site you use is breached, your email and password can end up on lists that criminals trade. They then try that pair on other popular sites. If you reused the password, they get in without having to guess anything.","Good hygiene limits the damage. Unique passwords mean one breach affects one account. Changing passwords when there is a reason, rather than on a fixed calendar, also avoids the habit of making small, predictable changes."],
  example:"A staff member uses the same password for a hobby forum and for their work email. The forum is breached. Within days, someone tries those details against Microsoft 365 and gets in.",
  dos:["Use a different password for every account","Aim for 14 or more characters","Change a password at once after a suspected breach"],
  donts:["Share passwords by email or chat","Write passwords on sticky notes","Reuse work passwords on personal sites"]},
manager:{
  cap:"The manager only fills in a login when the site address matches.",
  how:["A password manager keeps an encrypted vault of your logins. It creates strong random passwords and fills them in for you, so you do not have to remember or type them. Because it matches the exact website address, it will not fill your bank password into a look-alike site, which gives you an early warning.","The vault is only as safe as the master password and the second factor protecting it. Choose a long, unique passphrase you have never used elsewhere, and turn on multi-factor authentication for the manager itself."],
  example:"A user clicks a link to what looks like their bank. Their password manager stays quiet and offers no login. They stop, open the bank from a bookmark instead, and the manager fills the login straight away.",
  dos:["Use a long, unique master passphrase","Turn on multi-factor authentication for the vault","Use shared vaults for team passwords"],
  donts:["Keep passwords in spreadsheets or notes","Send passwords by email or chat","Type a password by hand on a page your manager refuses to fill"]},
mfa:{
  cap:"Stronger methods resist phishing. A password on its own is the weakest.",
  how:["Multi-factor authentication means signing in needs something you know (a password) and something you have (a phone or key). If a criminal steals the password, they still cannot get in without the second item.","Not all methods are equal. Passkeys and hardware keys check the website's address and cannot be fooled by a fake page. Authenticator apps are strong. SMS codes are better than nothing but can be intercepted or phished. Attackers also try MFA fatigue: they send repeated prompts hoping you will approve one just to make it stop."],
  example:"At 2am, a user gets six approval prompts they did not start. They deny every one and change their password in the morning. IT confirms the password had leaked in a breach. MFA stopped the break-in.",
  dos:["Turn on MFA for email, banking and work accounts","Prefer passkeys or authenticator apps over SMS","Keep backup codes somewhere safe and offline"],
  donts:["Approve a prompt you did not start","Read a code out to anyone","Turn MFA off because the prompts are annoying"]},
"malware-attach":{
  cap:"The file looks routine. Opening it is what runs the attack.",
  how:["A malware attachment hides a program inside something ordinary: an invoice, a statement, a voicemail notice, a CV or a shared document. The message gives you a reason to open it now, and the moment you do, code runs. Office files lean on macros, small programs that only run once you click Enable Content, which is why that prompt is the whole trick.","Attackers dodge scanning in clever ways. Password-protected ZIPs put the password in the email so security tools cannot look inside. Double extensions such as invoice.pdf.exe disguise a program as a document, especially where the system hides file endings."],
  example:"An accounts clerk receives 'Remittance advice attached' from what looks like a supplier. The ZIP is password-protected, with the password in the email. Inside is a file that, once opened, quietly installs a remote-access tool. A one-minute call to the supplier shows they sent nothing.",
  dos:["Confirm unexpected files with the sender through another channel","Turn on 'show file extensions' so disguised programs are visible","Report the message instead of opening the file"],
  donts:["Enable content, macros or editing because a document asks","Open password-protected archives you did not expect","Assume a known sender means the file is safe"]},
"cred-harvest":{
  cap:"A perfect copy of a login you trust. Everything you type is captured.",
  how:["A credential harvest is about one thing: getting you to type your password into a page the attacker controls. The page is an exact copy of a sign-in you use every day, reached through a link about a shared file, a locked account or a held parcel. Whatever you enter is sent straight to the attacker, who may even forward you to the real site so nothing feels wrong.","The defence is to never sign in from a link. The registered domain, the part just before the first single slash, is what identifies the real owner, and a password manager that refuses to autofill on a look-alike address is an early warning worth trusting."],
  example:"A user gets 'You have a new secure document' with a Review button. It opens a flawless Microsoft 365 login. They type their password; the page shows a brief error, then lands them on the real Office portal. Nothing looked wrong, but their password is now in an attacker's hands.",
  dos:["Open the service from a bookmark or by typing the address","Read the domain just before the first single slash","Let MFA and your password manager back you up"],
  donts:["Sign in from a link in a message","Trust a page just because it looks identical","Ignore a password manager that will not autofill"]},
"driveby":{
  cap:"The page can attack the moment it loads, with no click from you.",
  how:["A drive-by URL is a web page built to attack your device as it loads. It targets flaws in out-of-date browsers, plugins and operating systems, so it can run code without you downloading or clicking anything. The page might look blank, show a fake error, or imitate a familiar site while it works in the background.","Because the danger is invisible, the defences are the ones you keep running in advance: prompt updates close the flaws these pages rely on, and web filtering blocks known-bad and newly registered sites before the page ever loads. Shortened or redirecting links make this worse by hiding the real destination until you are already there."],
  example:"A staff member clicks a shortened link in a message, expecting a news article. The page loads what looks like a loading spinner. Behind it, code probes the browser for an unpatched flaw. On a fully updated laptop nothing happens; on one months behind on updates, it would have been enough.",
  dos:["Keep your browser and operating system fully updated","Leave web filtering on, on and off the office network","Expand shortened links or avoid clicking them"],
  donts:["Delay updates or turn off automatic updating","Bypass a filter block to reach a page","Click shortened links from unexpected senders"]},
"link-in-attach":{
  cap:"The email body is clean. The phishing link is one file deep.",
  how:["A link in attachment moves the bad link out of the email body and into a file, a PDF, a Word document or an image. Many filters focus on links in the message itself, so hiding the link inside an attachment helps the whole thing arrive looking harmless. The file then shows a button or image, 'View document', 'Open in OneDrive', 'Review invoice', that leads to a fake login or a malware download.","The lesson is that opening the attachment is not the finish line. The link inside deserves exactly the same suspicion as a link in an email: check where it really goes, and reach any sign-in through a bookmark instead of the button in the file."],
  example:"An unexpected PDF titled 'Invoice_overdue' opens to a single 'View secure invoice' button. It leads to a convincing Microsoft 365 login. The email had no links at all, so it passed straight through, and the trap only springs one click inside the file.",
  dos:["Treat links inside files as warily as links in emails","Open any sign-in from a bookmark, not the file's button","Report unexpected documents that push you to log in"],
  donts:["Assume a clean-looking email with one attachment is safe","Click 'View document' buttons inside unexpected files","Sign in because an attachment tells you to"]},
"link-to-malware":{
  cap:"Hosted on a trusted service to look safe. No attachment to scan.",
  how:["A link to malware puts the dangerous file on a well-known hosting service, SharePoint, OneDrive, Dropbox or Google Drive, and sends you a link instead of an attachment. This does two things: it borrows the hosting brand's good reputation, and it means there is no file in the email for attachment scanning to catch. The link leads to a familiar-looking file-share page and then to a download that is the actual malware.","A trusted hosting brand is not a safety check. The only question that matters is the same one you ask of any file: did I expect this, from this person, and does it make sense? When in doubt, confirm with the sender on a channel you already trust before you download anything."],
  example:"A message with a genuine-looking SharePoint link says 'Shared with you: 2026 pricing'. The page looks exactly like SharePoint and offers a download. The file is malware. Because nothing was attached to the email, attachment scanning never had anything to inspect.",
  dos:["Confirm unexpected shared files with the sender separately","Judge the file by whether you expected it, not the host","Report links to files you did not ask for"],
  donts:["Trust a file because it sits on a known cloud service","Download unexpected shared files on the spot","Assume a reputable host has scanned the file for you"]},
"oauth-consent":{
  cap:"No password is stolen. You grant lasting access by clicking Accept.",
  how:["An OAuth consent grant does not try to capture your password at all. Instead, a third-party app asks for permission to access your account, and a real sign-in and consent screen, often from a genuine provider, appears. If you click Accept, the app receives an access token. That token is tied to the app, not your password, so it keeps working even after you change the password. Access has to be revoked from the account's connected or enterprise applications.","The warning signs are in the detail: an app you do not recognise, asking for broad permissions such as read your mail, send mail as you, or access your files, often phrased as 'on your behalf' and 'while you are not using the app'. Reading the permissions before clicking is the whole defence."],
  example:"A user receives an invite to a 'document collaboration' tool. The Microsoft consent screen is completely genuine and asks to read and send mail on their behalf. They click Accept. Days later, phishing is being sent from their mailbox, and resetting the password changes nothing until IT revokes the app's access.",
  dos:["Read exactly what an app is asking to do before accepting","Grant access only to apps you deliberately set up","Report unexpected consent prompts to IT so the token can be revoked"],
  donts:["Accept a consent prompt for an app you did not request","Assume a password change removes a granted app's access","Approve broad 'read and send mail' permissions casually"]}
};

const X = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const rect = (x,y,w,h,c,rx=10) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" class="${c}"/>`;
const txt = (x,y,s,c="tx",sz=16,a="start",b=false) => `<text x="${x}" y="${y}" class="${c}${b?" b":""}" font-size="${sz}" text-anchor="${a}">${X(s)}</text>`;
const line = (x1,y1,x2,y2,c="gl") => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${c}"/>`;
function arrow(x1,y1,x2,y2,c="gl",f="gfm"){
  const a=Math.atan2(y2-y1,x2-x1), L=11, W=5.5;
  const bx=x2-Math.cos(a)*L, by=y2-Math.sin(a)*L, px=-Math.sin(a)*W, py=Math.cos(a)*W;
  return line(x1,y1,bx,by,c)+`<polygon points="${x2},${y2} ${bx+px},${by+py} ${bx-px},${by-py}" class="${f}"/>`;
}
const arB = (x1,y1,x2,y2) => arrow(x1,y1,x2,y2,"glb","gfb");
const arO = (x1,y1,x2,y2) => arrow(x1,y1,x2,y2,"glo","gfo");
const cross = (cx,cy) => `<path d="M${cx-7} ${cy-7} l14 14 M${cx+7} ${cy-7} l-14 14" class="glb"/>`;
const check = (cx,cy) => `<path d="M${cx-8} ${cy} l6 7 l11 -14" class="glo"/>`;
const mark = (x,y,n) => `<circle cx="${x}" cy="${y}" r="12" class="gsig"/>` + txt(x,y+5,n,"ts",14,"middle",true);
const svg = (inner,label) => `<svg viewBox="0 0 560 250" role="img" aria-label="${X(label)}">${inner}</svg>`;
