/* ============ STATE ============ */
const KEY = "cyberawareness.v1";
let S = { name:"", org:"", t:{} };
let storageOk = true;
function load(){
  try{ const r = localStorage.getItem(KEY); if(r){ const o = JSON.parse(r); S = { name:o.name||"", org:o.org||"", t:o.t||{}, firstOpened:o.firstOpened||"", uid:o.uid||"", trackedStarted:o.trackedStarted||false }; } }
  catch(e){ storageOk = false; }
  if(CUSTOMER && !S.org) S.org = CUSTOMER;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ storageOk = false; } }
load();
// ---- Tracking: record first-open locally; when TRACK_URL is set, report the learner's name to the collector once they enter it ----
function sendTrack(event){
  if(!TRACK_URL) return;
  try{
    const u = TRACK_URL + (TRACK_URL.indexOf("?")>=0?"&":"?")
      + "event=" + encodeURIComponent(event)
      + "&name=" + encodeURIComponent(S.name||"")
      + "&customer=" + encodeURIComponent(CUSTOMER)
      + "&ts=" + encodeURIComponent(new Date().toISOString());
    new Image().src = u;
  }catch(e){}
}
(function track(){
  try{ const uid = new URLSearchParams(location.search).get("u") || ""; if(uid){ S.uid = uid; if(!S.name) S.name = uid; } }catch(e){}
  if(!S.firstOpened){ S.firstOpened = new Date().toISOString(); save(); }
})();

const ALL = MODULES.flatMap(m => m.topics.map(t => Object.assign({}, t, EXTRA[t.id]||{}, { mod:m })));
const total = ALL.length;
const rec = id => S.t[id] || { viewed:false, attempts:0, best:0, passed:false };
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const doneCount = () => ALL.filter(t => rec(t.id).passed).length;
const pct = (n,d) => d ? Math.round(n/d*100) : 0;
function niceDate(s){ if(!s) return ""; const d=new Date(s+"T00:00:00"); return isNaN(d)?s:d.toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"}); }
function closeDate(){ if(WINDOW_CLOSE) return WINDOW_CLOSE; if(WINDOW_START){ const d=new Date(WINDOW_START+"T00:00:00"); d.setMonth(d.getMonth()+1); return d.toISOString().slice(0,10); } return ""; }
function windowState(){ const today=new Date().toISOString().slice(0,10); if(WINDOW_START && today<WINDOW_START) return "before"; const c=closeDate(); if(c && today>c) return "closed"; if(!WINDOW_START && !c) return "always"; return "open"; }
const trainingOpen = () => { const s=windowState(); return s==="open"||s==="always"; };
function csvQuote(v){ v=String(v==null?"":v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function csvText(){
  const head=["Name","Organisation","User","Submitted","FirstOpened","WindowStart","WindowClose","TopicsPassed","TotalTopics","PercentPassed"];
  const row=[S.name||"",S.org||CUSTOMER||"",S.uid||"",new Date().toISOString().slice(0,10),S.firstOpened||"",WINDOW_START||"",closeDate()||"",doneCount(),total,pct(doneCount(),total)];
  ALL.forEach(t=>{ head.push(t.title); const r=rec(t.id); row.push(r.passed?("pass "+r.best+"/3"):(r.attempts?("fail "+r.best+"/3"):"not started")); });
  return head.map(csvQuote).join(",")+"\n"+row.map(csvQuote).join(",")+"\n";
}
function submitMailto(){
  const subj=(CUSTOMER?CUSTOMER+" — ":"")+BRAND+" results: "+(S.name||"(no name)");
  const body=summaryText()+"\n\n----- CSV (please keep, used for the report) -----\n"+csvText();
  return "mailto:"+encodeURIComponent(REPORT_EMAIL)+"?subject="+encodeURIComponent(subj)+"&body="+encodeURIComponent(body);
}
function downloadCSV(){
  try{
    const blob=new Blob([csvText()],{type:"text/csv;charset=utf-8"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download=(CUSTOMER?CUSTOMER+"-":"")+"training-"+((S.name||"learner").replace(/[^a-z0-9]+/gi,"-").toLowerCase().replace(/^-|-$/g,""))+".csv";
    document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},0);
  }catch(e){ alert("Could not download the file on this device. Please use Copy summary instead."); }
}
function statusOf(id){
  const r = rec(id);
  if(r.passed) return "done";
  if(r.attempts>0) return "tried";
  if(r.viewed) return "read";
  return "new";
}
function statusText(id){
  const r = rec(id);
  if(r.passed) return "Passed " + r.best + "/3";
  if(r.attempts>0) return "Best " + r.best + "/3, retry";
  if(r.viewed) return "Lesson read";
  return "Not started";
}

function tileHTML(t){
  const st = statusOf(t.id);

  return `<button class="tile ${st==="new"?"":st}" data-act="open" data-id="${t.id}">
    <span class="t">${esc(t.title)}<span class="s">${esc(statusText(t.id))}</span></span>
    <span class="dot" aria-hidden="true">${mark}</span></button>`;
}

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function startQuiz(id){
  if(!trainingOpen()) return;
  const t = ALL.find(x => x.id===id);
  Q = { id, idx:0, score:0, answered:false, picked:-1,
        order: t.qs.map(q => shuffle([0,1,2,3])) };
  go({ name:"quiz" });
}

function renderQuiz(){
  const t = ALL.find(x => x.id===Q.id);
  const q = t.qs[Q.idx];
  const ord = Q.order[Q.idx];
  const opts = ord.map((orig,pos) => {
    let cls = "opt", dis = "";
    if(Q.answered){
      dis = "disabled";
      if(orig===0) cls += " right";
      else if(pos===Q.picked) cls += " wrong";
    }
    return `<button class="${cls}" ${dis} data-act="ans" data-pos="${pos}">${esc(q[1+orig])}</button>`;
  }).join("");
  let fb = "";
  if(Q.answered){
    const ok = ord[Q.picked]===0;
    fb = `<div class="fb ${ok?"good":"miss"}" role="status"><b>${ok?"Correct.":"Not quite."}</b> ${esc(q[5])}</div>
      <button class="btn primary" data-act="next">${Q.idx===t.qs.length-1 ? "See my result" : "Next question"}</button>`;
  }
  app.innerHTML = `<div class="panel">
    <div class="qhead"><span>${esc(t.title)}: question ${Q.idx+1} of ${t.qs.length}</span>
      <div class="bar"><i style="width:${pct(Q.idx+(Q.answered?1:0),t.qs.length)}%"></i></div></div>
    <p class="q">${esc(q[0])}</p>
    <div class="opts">${opts}</div>
    ${fb}
  </div>`;
}

function finishQuiz(){
  const t = ALL.find(x => x.id===Q.id);
  const r = rec(t.id);
  r.viewed = true; r.attempts += 1;
  r.best = Math.max(r.best, Q.score);
  if(Q.score >= PASS_MARK) r.passed = true;
  S.t[t.id] = r; save();
  go({ name:"result" });
}

function renderResult(){
  const t = ALL.find(x => x.id===Q.id);
  const passed = Q.score >= PASS_MARK;
  const i = ALL.indexOf(t);
  const next = ALL[i+1];
  const left = total - doneCount();
  app.innerHTML = `<div class="panel">
    <p class="note" style="margin:0">${esc(t.title)}</p>
    <div class="score">${Q.score} / ${t.qs.length}</div>
    <h1>${passed ? "Topic passed" : "Not passed yet"}</h1>
    <p class="intro">${passed
      ? (left===0 ? "You have passed every topic. Open your results to copy your summary." : `${left} topic${left===1?"":"s"} still to go.`)
      : `You need ${PASS_MARK} correct to pass. Re-read the lesson, then try again. The answers are explained as you go.`}</p>
    <div class="foot" style="margin-top:0">
      ${passed ? "" : `<button class="btn primary" data-act="open" data-id="${t.id}">Review the lesson</button><button class="btn" data-act="start" data-id="${t.id}">Retry now</button>`}
      ${passed && next ? `<button class="btn primary" data-act="open" data-id="${next.id}">Next: ${esc(next.title)}</button>` : ""}
      ${passed && left===0 ? `<button class="btn primary" data-act="results">View my results</button>` : ""}
      <button class="btn" data-act="home">All topics</button>
    </div>
  </div>`;
}

function summaryText(){
  const d = doneCount();
  const lines = [];
  lines.push(BRAND + " - results");
  lines.push("Name: " + (S.name || "(not entered)"));
  lines.push("Organisation: " + (S.org || "(not entered)"));
  lines.push("Date: " + new Date().toISOString().slice(0,10));
  lines.push("Topics passed: " + d + " of " + total + " (" + pct(d,total) + "%)");
  lines.push("");
  MODULES.forEach(m => {
    lines.push(m.name);
    m.topics.forEach(t => {
      const r = rec(t.id);
      lines.push("  " + t.title + ": " + (r.passed ? "Passed" : r.attempts ? "Not passed" : "Not started") +
        " (best " + r.best + "/3, attempts " + r.attempts + ")");
    });
  });
  return lines.join("\n");
}

function renderResults(){
  const d = doneCount();
  const rows = MODULES.map(m => {
    const done = m.topics.filter(t => rec(t.id).passed).length;
    return `<tr><th colspan="3" style="color:var(--text)">${esc(m.name)} (${done}/${m.topics.length})</th></tr>` +
      m.topics.map(t => {
        const r = rec(t.id);
        const pill = r.passed ? `<span class="pill ok">Passed</span>` : r.attempts ? `<span class="pill mid">Not passed</span>` : `<span class="pill no">Not started</span>`;
        return `<tr><td>${esc(t.title)}</td><td>${pill}</td><td>${r.attempts ? r.best+"/3" : "-"}</td></tr>`;
      }).join("");
  }).join("");
  app.innerHTML = `<div class="panel" style="max-width:860px">
    <button class="crumb" data-act="home">&larr; All topics</button>
    <h1>${d===total ? "All topics complete" : "My results"}</h1>
    <p class="intro">${esc(S.name || "Unnamed learner")}${S.org ? ", " + esc(S.org) : ""}: ${d} of ${total} topics passed (${pct(d,total)}%).</p>
    <div class="bar" style="margin-bottom:8px"><i style="width:${pct(d,total)}%"></i></div>
    <div class="tblwrap"><table class="tbl"><thead><tr><th>Topic</th><th>Status</th><th>Best score</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="note">Copy this summary and send it to whoever asked for your results.</p>
    <textarea class="sum" id="sum" readonly>${esc(summaryText())}</textarea>
    <div class="foot">
      <button class="btn teal" data-act="copy" id="cpy">Copy summary</button>
      <button class="btn" data-act="download">Download CSV</button>
      ${REPORT_EMAIL ? `<a class="btn primary" href="${submitMailto()}">Submit my results</a>` : ""}
    </div>
    ${REPORT_EMAIL ? `<p class="note">Submit opens an email to ${esc(REPORT_EMAIL)} with your results in the message. For a file, use Download CSV and attach it.</p>` : ""}
  </div>`;
}

function render(){
  if(view.name==="home") renderHome();
  else if(view.name==="topic") renderTopic();
  else if(view.name==="quiz") renderQuiz();
  else if(view.name==="result") renderResult();
  else if(view.name==="results") renderResults();
}

/* ============ EVENTS ============ */
let resetArmed = false;
app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if(!b) return;
  const act = b.dataset.act;
  if(act==="open"){
    const r = rec(b.dataset.id); r.viewed = true; S.t[b.dataset.id] = r; save();
    go({ name:"topic", id:b.dataset.id });
  }
  else if(act==="home"){ resetArmed=false; go({ name:"home" }); }
  else if(act==="start"){ startQuiz(b.dataset.id); }
  else if(act==="ans"){
    if(Q.answered) return;
    Q.picked = +b.dataset.pos; Q.answered = true;
    if(Q.order[Q.idx][Q.picked]===0) Q.score++;
    render();
    const nx = app.querySelector('[data-act="next"]'); if(nx) nx.focus();
  }
  else if(act==="next"){
    const t = ALL.find(x => x.id===Q.id);
    if(Q.idx < t.qs.length-1){ Q.idx++; Q.answered=false; Q.picked=-1; render(); window.scrollTo(0,0); }
    else finishQuiz();
  }
  else if(act==="results"){ go({ name:"results" }); }
  else if(act==="copy"){
    const ta = document.getElementById("sum"), btn = document.getElementById("cpy");
    const fallback = () => { ta.focus(); ta.select(); btn.textContent = "Selected. Press Ctrl+C or Copy"; };
    try{
      navigator.clipboard.writeText(ta.value).then(() => { btn.textContent = "Copied"; }, fallback);
    }catch(err){ fallback(); }
  }
  else if(act==="download"){ downloadCSV(); }
  else if(act==="reset"){
    if(!resetArmed){ resetArmed = true; b.textContent = "Click again to erase all progress"; return; }
    S = { name:S.name, org:S.org, t:{} }; save(); resetArmed=false; render();
  }
});

render();
</script>
</body>
</html>
